<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f3f4f6;
      color: #1f2937;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .login-card {
      width: min(100%, 380px);
      padding: 32px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 12px 32px rgb(15 23 42 / 10%);
    }
    h1 { margin: 0 0 8px; text-align: center; }
    .intro { margin: 0 0 24px; color: #6b7280; text-align: center; }
    label { display: block; margin: 16px 0 6px; font-size: 14px; font-weight: 600; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font: inherit;
    }
    input:focus { outline: 2px solid #93c5fd; border-color: #2563eb; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .note { margin: 16px 0 0; color: #6b7280; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Welcome back</h1>
    <p class="intro">Sign in to your account</p>
    <form action="#" method="post">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit">Sign in</button>
    </form>
    <p class="note">Demo interface only; connect the form to a secure authentication service.</p>
  </main>
</body>
</html>
